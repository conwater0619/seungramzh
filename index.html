<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다수결 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e7; --card:#fffdf8; --ink:#2b2a27; --muted:#7a7365; --line:#e6dfd0;
    --a:#e2673b; --a-soft:#fde6dc; --b:#2f7fb8; --b-soft:#dcecf7; --ok:#2e9b5b; --gold:#f2b134;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
    font-family:"Jua","Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-text-size-adjust:100%}
  #app{max-width:900px;margin:0 auto;padding:16px 16px 40px}
  .host #app{max-width:1400px}
  .hw{display:flex;gap:16px;align-items:flex-start}
  .hm{flex:1;min-width:0}
  .side{width:230px;flex:none;margin-top:52px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;cursor:pointer;position:sticky;top:12px}
  .side .st{font-size:16px;font-weight:700;color:#2b3a4f;margin-bottom:8px}
  .side .sq{width:200px;height:200px;margin:0 auto;border:2px solid var(--line);border-radius:10px;overflow:hidden}
  .side .sq svg{display:block;width:100%;height:100%}
  .side .sa{margin-top:8px;font-family:Consolas,"Courier New",monospace;font-weight:700;font-size:15px;word-break:break-all;color:#1b1b1b}
  .side .sn{margin-top:6px;font-size:15px;color:#5b6b80}
  @media (max-width:900px){.hw{flex-direction:column}.side{width:auto;margin-top:0;position:static}}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;color:var(--muted);font-size:15px}
  .badge{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px}
  .badge.demo{background:#fff3cd;border-color:#f0d98a;color:#7a5b00}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 2px 0 rgba(0,0,0,.03)}
  h1{font-size:34px;margin:0 0 6px} h2{font-size:26px;margin:0 0 12px}
  .center{text-align:center}
  .muted{color:var(--muted)}
  input[type=text]{width:100%;font:inherit;font-size:22px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink)}
  input[type=text]:focus{outline:none;border-color:var(--a)}
  button{font:inherit;cursor:pointer}
  .btn{background:var(--a);color:#fff;border:0;border-radius:14px;padding:14px 26px;font-size:22px}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
  .btn.big{font-size:28px;padding:18px 36px}
  .err{color:#c0392b;min-height:24px;margin-top:8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:18px}
  .draw{margin:18px auto 0;max-width:520px;background:#fff8e1;border:2px solid #f6b73c;border-radius:18px;padding:14px}
  .draw .dlabel{font-size:18px;color:#8a6a1c}
  .draw .dname{font-size:clamp(34px,8vw,64px);font-weight:800;line-height:1.2;min-height:1.2em;word-break:break-all}
  .draw .dname.win{color:#c0392b;animation:pop .5s}
  @keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  .chip.off{opacity:.4}
  button.chip{cursor:pointer;font:inherit;font-size:18px;color:inherit}
  button.chip.kick:hover{border-color:#d33;background:#fff0f0}
  .chip.armed{background:#d33;color:#fff;border-color:#d33;opacity:1}
  .btn.danger{background:#d33;color:#fff;border-color:#d33}
  .pl-ov{position:fixed;inset:0;z-index:40;background:rgba(20,30,50,.5);display:flex;align-items:center;justify-content:center;padding:16px}
  .pl-box{background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:86vh;overflow:auto;padding:18px}
  .pl-h{display:flex;justify-content:space-between;align-items:center;font-size:22px;margin-bottom:10px}
  .pl-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:18px}
  .pl-row .btn,.pl-h .btn{padding:8px 14px;font-size:16px}
  .pl-n{flex:1;font-weight:700;word-break:break-all}
  .pl-s{color:#5b6b80}
  .pl-o.on{color:#1a8a4a}.pl-o.off{color:#b44}
  .chip.me{border-color:var(--a);background:var(--a-soft)}
  .qno{color:var(--muted);font-size:18px;margin-bottom:4px}
  .qtext{font-size:clamp(24px,5vw,40px);line-height:1.3;margin:0 0 16px}
  .timer{display:flex;align-items:center;gap:12px;margin:8px 0 18px}
  .tbar{flex:1;height:16px;background:#ece5d5;border-radius:999px;overflow:hidden}
  .tbar>i{display:block;height:100%;width:100%;background:var(--gold);transition:width .1s linear}
  .tbar.low>i{background:#d9453a}
  .tnum{font-size:34px;min-width:2ch;text-align:right}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:560px){.opts{grid-template-columns:1fr}}
  .opt{border:3px solid transparent;border-radius:20px;padding:28px 12px;font-size:clamp(24px,5vw,38px);color:#fff;min-height:130px;line-height:1.25}
  .opt.A{background:var(--a)} .opt.B{background:var(--b)}
  .opt.sel{border-color:var(--ink);box-shadow:0 0 0 4px rgba(0,0,0,.12) inset}
  .opt:disabled{cursor:default}
  .opt:disabled:not(.sel){opacity:.55}
  .picked{margin-top:12px;font-size:20px;min-height:28px}
  .res{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:560px){.res{grid-template-columns:1fr}}
  .col{border-radius:20px;padding:16px;border:3px solid transparent}
  .col.A{background:var(--a-soft)} .col.B{background:var(--b-soft)}
  .col.win{border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,177,52,.25)}
  .col h3{margin:0 0 6px;font-size:24px}
  .cnt{font-size:44px;line-height:1}
  .pbar{height:12px;border-radius:99px;background:rgba(0,0,0,.08);margin:8px 0 10px;overflow:hidden}
  .pbar>i{display:block;height:100%}
  .A .pbar>i{background:var(--a)} .B .pbar>i{background:var(--b)}
  .who{display:flex;flex-wrap:wrap;gap:6px}
  .who span{background:#fff;border-radius:999px;padding:3px 10px;font-size:16px}
  .who span.me{outline:2px solid var(--ink)}
  .verdict{margin:14px 0 4px;font-size:clamp(22px,4vw,30px);text-align:center}
  .me-res{margin:10px 0;text-align:center;font-size:clamp(22px,4vw,30px)}
  .me-res.good{color:var(--ok)}
  table.rank{width:100%;border-collapse:collapse;font-size:20px}
  table.rank td{padding:8px 10px;border-bottom:1px solid var(--line)}
  table.rank td:first-child{width:3.2ch;text-align:center}
  table.rank td:last-child{text-align:right;white-space:nowrap}
  table.rank tr.me{background:var(--a-soft)}
  .host-bar{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .joinurl{font-family:Consolas,"Courier New",monospace;font-size:clamp(20px,4vw,40px);word-break:break-all;margin:10px 0;color:var(--a)}
  .podium{font-size:clamp(28px,6vw,56px);margin:6px 0}
  label.chk{font-size:17px;color:var(--muted);display:flex;gap:6px;align-items:center}
  .join-ov{position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:3vh 3vw;cursor:pointer;animation:fadein .2s}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .join-ov .jt{font-size:clamp(24px,5vh,56px);color:#2b3a4f;text-align:center}
  .join-ov .jrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4vw}
  .join-ov .jqr{width:min(40vh,86vw,520px);height:min(40vh,86vw,520px);border:3px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
  .join-ov .jqr svg{display:block;width:100%;height:100%}
  .join-ov .ja{font-family:Consolas,"Courier New",ui-monospace,monospace;font-weight:700;color:#1b1b1b;white-space:nowrap;text-align:center}
  .join-ov .jh{font-size:clamp(16px,3vh,28px);color:#5b6b80;text-align:center}
  .join-ov .jp{width:100%;max-width:1400px;text-align:center}
  .join-ov .jpn{font-size:clamp(18px,3vh,30px);color:#2b3a4f;margin-bottom:4px}
  .join-ov .jpl{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 10px;max-height:22vh;overflow:auto}
  .join-ov .jpl span{background:#eef3fb;border-radius:999px;padding:3px 14px;font-size:clamp(16px,2.8vh,28px)}
  .join-ov .jpl span.off{opacity:.4}
  .join-ov .jx{position:absolute;top:14px;right:18px;font-size:16px;color:#9aa4b2}
  .btn.qrbtn{font-size:20px;padding:10px 20px}
  .cols2{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start}
  @media (max-width:760px){.cols2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>

<script src="firebase-config.js"></script>
<script>
(function(){
'use strict';
const params = new URLSearchParams(location.search);
const ROOM = (params.get('room') || 'yanghak').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 30) || 'yanghak';
const IS_HOST = params.has('host');
const TIME = Math.max(2, parseInt(params.get('t'), 10) || 20);        // 문제당 제한 시간(초)
const Q = window.QUESTIONS || [];
const $app = document.getElementById('app');
if (IS_HOST) document.body.classList.add('host');

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { sessionStorage.setItem(k, v); } catch(e){} }
};

/* ============ 연습 모드용 가짜 데이터베이스 (같은 브라우저의 탭끼리 연결) ============ */
function makeLocalDB(){
  const KEY = 'ig-demo-db';
  let data = {}; try { data = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){}
  const subs = [];
  const parts = p => p.split('/').filter(Boolean);
  const get = p => {
    if (p === '.info/serverTimeOffset') return 0;
    if (p === '.info/connected') return true;
    let o = data; for (const k of parts(p)){ if (o == null || typeof o !== 'object') return null; o = o[k]; }
    return o === undefined ? null : o;
  };
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){} };
  const putRaw = (p, val) => {
    const ks = parts(p);
    if (!ks.length){ data = val || {}; return; }
    let o = data;
    for (let i = 0; i < ks.length - 1; i++){ if (o[ks[i]] == null || typeof o[ks[i]] !== 'object') o[ks[i]] = {}; o = o[ks[i]]; }
    if (val === null || val === undefined) delete o[ks[ks.length - 1]]; else o[ks[ks.length - 1]] = JSON.parse(JSON.stringify(val));
  };
  const snap = p => { const v = get(p); return { val: () => v == null ? null : JSON.parse(JSON.stringify(v)), exists: () => v != null }; };
  // 바뀐 경로와 관련 있는 구독만 알려 줘요 (.info 는 제외) — 안 그러면 서로를 계속 불러서 멈춰요
  const fire = (changed) => {
    const c = '/' + parts(changed || '').join('/');
    subs.slice().forEach(s => {
      if (s.path.startsWith('.info')) return;
      const sp = '/' + parts(s.path).join('/');
      if (!changed || sp === c || sp.startsWith(c + '/') || c.startsWith(sp + '/') || sp === '/') s.cb(snap(s.path));
    });
  };
  window.addEventListener('storage', e => { if (e.key === KEY){ try { data = JSON.parse(e.newValue || '{}'); } catch(_){ data = {}; } fire(); } });
  function ref(path){
    return {
      set(v){ putRaw(path, v); persist(); fire(path); return Promise.resolve(); },
      update(o){ Object.entries(o).forEach(([k, v]) => putRaw(path + '/' + k, v)); persist(); fire(path); return Promise.resolve(); },
      remove(){ return this.set(null); },
      once(){ return Promise.resolve(snap(path)); },
      on(ev, cb){ subs.push({ path, cb }); setTimeout(() => cb(snap(path)), 0); return cb; },
      onDisconnect(){ return { set(){ return Promise.resolve(); }, cancel(){ return Promise.resolve(); } }; }
    };
  }
  return { ref, local: true };
}

/* ============ Firebase 또는 연습 모드 연결 ============ */
function loadScript(src){
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(s); });
}
async function connect(){
  const cfg = window.FIREBASE_CONFIG || {};
  if (cfg.apiKey && cfg.databaseURL){
    const v = '10.12.2';
    await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);
    await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-database-compat.js`);
    firebase.initializeApp(cfg);
    return { ref: p => firebase.database().ref(p), local: false };
  }
  return makeLocalDB();
}

/* ============ 효과음 (호스트 화면에서만, 소리 파일 없이 브라우저가 직접 만들어요) ============ */
let AC = null, muted = false;
try { muted = localStorage.getItem('ig:mute') === '1'; } catch(e){}
function ac(){
  if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
if (IS_HOST) document.addEventListener('pointerdown', ac, true);      // 처음 누를 때 소리가 켜져요 (브라우저 규칙)
function beep(f, dur, o){
  const a = IS_HOST && !muted ? ac() : null; if (!a) return; o = o || {};
  const t0 = a.currentTime + (o.at || 0), osc = a.createOscillator(), g = a.createGain(), vol = o.vol == null ? .2 : o.vol;
  osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t0);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .008); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(a.destination); osc.start(t0); osc.stop(t0 + dur + .03);
}
function sTick(n, urgent){                                             // 째깍, 째깍 (번갈아 높낮이가 달라요)
  if (urgent) beep(n % 2 ? 1500 : 1900, .07, { type: 'square', vol: .16 });
  else beep(n % 2 ? 900 : 1250, .05, { type: 'triangle', vol: .22 });
}
function sTimeUp(){ beep(520, .32, { type: 'sawtooth', vol: .16, to: 330 }); beep(330, .5, { type: 'sawtooth', vol: .16, to: 220, at: .3 }); }   // 뿌우~ (시간 종료)
function sReveal(){ [523, 659, 784, 1047].forEach((f, i) => beep(f, .16, { type: 'triangle', vol: .22, at: i * .09 })); }                    // 띠리링~ (결과 공개)
function sFinal(){ [523, 523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => beep(f, i === 7 ? .7 : .18, { type: 'triangle', vol: .24, at: i * .16 })); }  // 빠바바밤~ (최종)

/* ============ 게임 상태 ============ */
let db, roomRef, offset = 0;
let R = { state: { phase: 'lobby' }, players: {}, votes: {}, rounds: {}, kicked: {}, draw: null };
let me = null;                    // { pid, name }  (참가자만)
let myChoice = {};                // 낙관적 화면 표시용: { q번호: 'A'|'B' }
let joinError = '';
let kickArm = { pid: null, until: 0 };   // 내보내기 확인(두 번 누르기)용
const now = () => Date.now() + offset;
const isKicked = () => !!(me && !IS_HOST && (R.kicked || {})[me.pid]);
const qkey = n => 'q' + n;

function scoreOf(pid){
  let s = 0;
  Object.values(R.rounds || {}).forEach(r => { const c = r.v && r.v[pid]; if (c && (r.w === 'T' || r.w === c)) s++; });
  return s;
}
function ranking(){
  const list = Object.entries(R.players || {}).map(([pid, p]) => ({ pid, name: p.name, online: p.online !== false, score: scoreOf(pid) }));
  list.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, 'ko'));
  list.forEach(x => { x.rank = 1 + list.filter(y => y.score > x.score).length; });
  return list;
}
function onlinePlayers(){ return Object.entries(R.players || {}).filter(([, p]) => p.online !== false); }

/* ---------- 참가자 동작 ---------- */
async function join(name){
  name = name.trim().replace(/\s+/g, ' ');
  if (!name){ joinError = '닉네임을 입력해 주세요.'; return render(); }
  if (name.length > 10){ joinError = '닉네임은 10글자까지예요.'; return render(); }
  const players = (await db.ref(`rooms/${ROOM}/players`).once('value')).val() || {};
  let pid = null;
  for (const [id, p] of Object.entries(players)){
    if (p.name === name){
      if (p.online === false) pid = id;                 // 같은 이름이 오프라인이면 그 자리를 이어받아요
      else { joinError = '이미 쓰고 있는 닉네임이에요. 다른 이름을 써 주세요.'; return render(); }
    }
  }
  if (!pid) pid = 'p' + Math.random().toString(36).slice(2, 9);
  me = { pid, name };
  store.set(`ig:${ROOM}:me`, JSON.stringify(me));
  joinError = '';
  await announce();
  render();
}
async function announce(){
  if (!me || isKicked()) return;
  const pr = db.ref(`rooms/${ROOM}/players/${me.pid}`);
  const existing = (await pr.once('value')).val();
  await pr.update({ name: me.name, online: true, joinedAt: existing && existing.joinedAt || Date.now() });
}
function watchConnection(){
  db.ref('.info/connected').on('value', s => {
    if (s.val() === true && me && !isKicked()){
      const o = db.ref(`rooms/${ROOM}/players/${me.pid}/online`);
      o.onDisconnect().set(false);
      o.set(true);
    }
  });
  if (db.local) window.addEventListener('pagehide', () => { if (me) db.ref(`rooms/${ROOM}/players/${me.pid}/online`).set(false); });
}
function vote(c){
  const st = R.state;
  if (!me || isKicked() || st.phase !== 'question' || now() >= st.deadline) return;
  myChoice[st.q] = c;
  db.ref(`rooms/${ROOM}/votes/${qkey(st.q)}/${me.pid}`).set(c);
  render();
}

/* ---------- 호스트 동작 ---------- */
function kickClick(pid){
  if (kickArm.pid === pid && Date.now() < kickArm.until){ kickArm = { pid: null, until: 0 }; kickPlayer(pid); return; }
  kickArm = { pid, until: Date.now() + 3000 };
  render(); refreshPlayers();
  setTimeout(() => { if (Date.now() >= kickArm.until){ kickArm = { pid: null, until: 0 }; render(); refreshPlayers(); } }, 3100);
}
function kickPlayer(pid){

const hostOpt = { auto: true };
function startQuestion(n){
  db.ref(`rooms/${ROOM}/state`).set({ phase: 'question', q: n, limit: TIME, deadline: now() + TIME * 1000 });
}

  setTimeout(() => startQuestion(0), 60);
}
let revealedFor = -1, prevPhase = null;
async function reveal(){
  const st = R.state;
  if (st.phase !== 'question' || revealedFor === st.q) return;
  revealedFor = st.q;
  const votes = ((await db.ref(`rooms/${ROOM}/votes/${qkey(st.q)}`).once('value')).val()) || {};
  if (R.state.phase !== 'question' || R.state.q !== st.q) return;      // 그 사이 끝내기를 눌렀다면 중단
  const v = {}; let a = 0, b = 0;
  Object.entries(votes).forEach(([pid, c]) => { if (R.players[pid] && (c === 'A' || c === 'B')){ v[pid] = c; c === 'A' ? a++ : b++; } });
  const w = a > b ? 'A' : b > a ? 'B' : (a + b > 0 ? 'T' : '-');
  await db.ref(`rooms/${ROOM}/rounds/${qkey(st.q)}`).set({ a, b, w, v });
  if (R.state.phase === 'question' && R.state.q === st.q) await db.ref(`rooms/${ROOM}/state`).update({ phase: 'reveal' });
}
function hostNext(){
  const n = R.state.q + 1;
  if (n < Q.length) startQuestion(n);
  else db.ref(`rooms/${ROOM}/state`).set({ phase: 'final', q: R.state.q });
}
let endArmedUntil = 0;
function hostEndClick(){
  if (Date.now() < endArmedUntil){ endArmedUntil = 0; hostEnd(); return; }
  endArmedUntil = Date.now() + 3500; render(); setTimeout(render, 3600);
}
function hostEnd(){
  revealedFor = R.state.q;                                             // 진행 중이던 문제는 점수에 넣지 않아요
  db.ref(`rooms/${ROOM}/state`).set({ phase: 'final', q: R.state.q, ended: true });
}

function hostRestart(){
  revealedFor = -1;
  db.ref(`rooms/${ROOM}`).update({ votes: null, rounds: null, draw: null });
  db.ref(`rooms/${ROOM}/state`).set({ phase: 'lobby' });
}
function topCandidates(){
  const list = ranking(), top = list.filter(p => p.rank === 1), done = (R.draw && R.draw.pids) || [];
  return { top, left: top.filter(p => !done.includes(p.pid)) };
}
function hostDraw(){
  const { top, left } = topCandidates();
  if (top.length < 2 || !left.length) return;
  const rnd = n => { try { return crypto.getRandomValues(new Uint32Array(1))[0] % n; } catch(e){ return Math.floor(Math.random() * n); } };
  const win = left[rnd(left.length)], prev = R.draw || { pids: [], names: [] };
  const c = left.map(p => p.name).sort(() => rnd(2) - .5);
  db.ref(`rooms/${ROOM}/draw`).set({ t: now(), c, pids: [...(prev.pids || []), win.pid], names: [...(prev.names || []), win.name] });
}
let drawKey = null, drawIdx = -1, drawDone = null;
function drawTick(){
  const dr = R.draw; if (!dr) return;
  const el = now() - dr.t;
  if (drawKey !== dr.t){ drawKey = dr.t; drawIdx = -1; }
  if (el < 3500){
    const n = document.getElementById('drawName'); if (!n) return;
    const idx = Math.floor(Math.pow(Math.max(0, el) / 3500, .6) * 28);
    if (idx !== drawIdx){ drawIdx = idx; n.textContent = dr.c[idx % dr.c.length]; if (IS_HOST) sTick(idx, false); }
  } else if (drawDone !== dr.t){
    drawDone = dr.t; render(); if (IS_HOST && el < 5500) sFinal();
  }
}
function hostTick(){
  const st = R.state;
  if (st.phase !== 'question') return;
  const votes = (R.votes || {})[qkey(st.q)] || {};
  const online = onlinePlayers();
  const voted = online.filter(([pid]) => votes[pid]).length;
  if (now() >= st.deadline + 700) reveal();
  else if (hostOpt.auto && online.length && voted >= online.length) reveal();
}

/* ============ 참가 QR·주소 큰 화면 ============ */
function joinFullUrl(){
  const base = location.origin + location.pathname.replace(/index\.html$/, '');
  return base + (ROOM !== 'yanghak' ? '?room=' + ROOM : '');                      // 호스트용 ?host 는 넣지 않아요
}
function qrSvg(url){
  let q = null;
  for (const ec of ['M', 'L']){ try { q = qrcode(0, ec); q.addData(url); q.make(); break; } catch(e){ q = null; } }
  if (!q) return '';
  const n = q.getModuleCount(), m = 2, sz = n + m * 2; let d = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) d += `M${x + m} ${y + m}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${sz} ${sz}" shape-rendering="crispEdges"><rect width="${sz}" height="${sz}" fill="#fff"/><path d="${d}" fill="#111"/></svg>`;
}
function showJoinPopup(){

  const url = joinFullUrl(), shown = url.replace(/^https?:\/\//, '').replace(/\/$/, '');

  if (ph === 'lobby' && IS_HOST){
    $('startBtn').onclick = hostStart;
    $('autoChk').onchange = e => { hostOpt.auto = e.target.checked; };
  }
  if (ph === 'question'){
    document.querySelectorAll('.opt').forEach(b => b.onclick = () => vote(b.dataset.v));
    if (IS_HOST){ $('revealBtn').onclick = reveal; $('endBtn').onclick = hostEndClick; }
  }
  if (ph === 'reveal' && IS_HOST){ $('nextBtn').onclick = hostNext; if ($('endBtn')) $('endBtn').onclick = hostEndClick; }
  if (ph === 'final' && IS_HOST){ $('againBtn').onclick = hostRestart; if ($('drawBtn')) $('drawBtn').onclick = hostDraw; }
}
let sndKey = '', sndSec = -1, sndDone = false;
function tick(){
  const st = R.state;
  if (st.phase === 'final') return drawTick();
  if (st.phase !== 'question') return;
  const remain = Math.max(0, st.deadline - now()), lim = (st.limit || TIME) * 1000;
  const bar = document.getElementById('tbar'), num = document.getElementById('tnum');
  if (!bar) return;
  bar.firstElementChild.style.width = (remain / lim * 100) + '%';
  bar.classList.toggle('low', remain <= 5000);
  const sec = Math.ceil(remain / 1000);
  num.textContent = sec;
  if (IS_HOST){
    const key = st.q + ':' + st.deadline;
    if (sndKey !== key){ sndKey = key; sndSec = sec; sndDone = false; }
    else if (sec !== sndSec){ sndSec = sec; if (sec > 0) sTick(sec, sec <= 5); }
    if (remain <= 0 && !sndDone){ sndDone = true; sTimeUp(); }
  }
  if (remain <= 0) document.querySelectorAll('.opt').forEach(b => b.disabled = true);
}

/* ============ 시작 ============ */
(async function main(){
  $app.innerHTML = '<div class="card center"><p class="muted">연결하는 중…</p></div>';
  try { db = await connect(); }
  catch(e){ $app.innerHTML = '<div class="card center"><h2>연결하지 못했어요</h2><p class="muted">인터넷 연결을 확인하고 새로고침해 주세요.</p></div>'; return; }
  db.ref('.info/serverTimeOffset').on('value', s => { offset = s.val() || 0; });
  try { const saved = JSON.parse(store.get(`ig:${ROOM}:me`) || 'null'); if (saved && saved.pid && !IS_HOST) me = saved; } catch(e){}
  roomRef = db.ref('rooms/' + ROOM);
  roomRef.on('value', s => {
    const v = s.val() || {};
    const pl = {}; Object.entries(v.players || {}).forEach(([k, p]) => { if (p && p.name) pl[k] = p; });     // 내보낸 뒤 남는 이름 없는 찌꺼기는 무시
    R = { state: v.state || { phase: 'lobby' }, players: pl, votes: v.votes || {}, rounds: v.rounds || {}, kicked: v.kicked || {}, draw: v.draw || null };
    if (R.state.phase === 'lobby') myChoice = {};
    if (IS_HOST && prevPhase !== null && prevPhase !== R.state.phase){
      if (R.state.phase === 'reveal' && prevPhase === 'question' && !sndDone) sReveal();     // 시간이 남았는데 공개됐을 때(모두 선택·직접 마감)
      if (R.state.phase === 'final') sFinal();
    }
    prevPhase = R.state.phase;
    if (me && !IS_HOST && !R.players[me.pid] && !isKicked()) announce();          // 호스트가 방을 비웠다가 다시 열어도 이어서 참가
    render(); refreshPlayers(); refreshJoinPopup();
  });
  if (me && !IS_HOST) announce();
  watchConnection();
  setInterval(tick, 100);
  if (IS_HOST) setInterval(hostTick, 300);
})();
})();
</script>
